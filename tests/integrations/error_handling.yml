# tests/integrations/error_handling.yml
name: "Error Handling & Edge Cases"
command: "qemu-system-i386 -cdrom output/AuriOS.iso -m 512M -display none -serial stdio"
timeout_ms: 10000

boot_sequence:
  - "System ready."

shell_interactions:
  prompt: "auri-os"
  tests:
    - command: "jhdsbfjdsbf"
      expect: "command not found: jhdsbfjdsbf"

    - command: "peek"
      expect: "usage:"

    - command: "poke 0x100"
      expect: "usage:"

    - command: "memdump abc"
      expect: "usage:"

    - command: "   "
      expect: "root@auri-os"

    - command: "uptime -r -s -p"
      expect: "ms"

    - command: "echo test; echo test2"
      expect: "test; echo test2"