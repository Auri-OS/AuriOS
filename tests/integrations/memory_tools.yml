name: "Memory Diagnostics (PMM/MMU)"
command: "qemu-system-i386 -cdrom output/AuriOS.iso -m 512M -display none -serial stdio"
timeout_ms: 8000

boot_sequence:
  - "System ready."

shell_interactions:
  prompt: "auri-os"
  tests:
    - command: "mmap"
      expect: "=== ACTIVE MEMORY MAPPINGS ==="

    - command: "memdump 16"
      expect: "=== PMM BITMAP DUMP ==="

    - command: "memdump"
      expect: "usage: memdump <size>"

    - command: "memtest"
      expect: "heap ok"

    - command: "memtest"
      expect: "reuse"

    - command: "peek 0xFFFFFFFF"
      expect: "Peeking at"

    - command: "peek 0x00000100"
      expect: "Peeking at 0x00000100"

    - command: "peek"
      expect: "usage: peek <hex address>"

    - command: "poke 0x00000100 0xFF"
      expect: "Wrote 0x000000FF at 0x00000100"

    - command: "poke 0x00000100"
      expect: "usage: poke <hex address> <hex value>"

    - command: "poke 0xDEADBEEF 0xAURIOS"
      expect: "Wrote 0xAURIOS at 0xDEADBEEF"

    - command: "peek 0x50000"
      expect: "Value found:"

    - command: "memdump 8"
      expect: "=== PMM BITMAP DUMP ==="

    - command: "memdump 32"
      expect: "=== PMM BITMAP DUMP ==="

    - command: "memdump 0"
      expect: "usage: memdump"

    - command: "mia"
      expect: "\nEXCEPTION: Page Fault"
      no_prompt: true
